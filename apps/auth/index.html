<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth App</title>
    <script type="module" src="/main.js"></script>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body class="flex flex-col items-center justify-center p-4 min-h-screen">
    
    <div class="text-center mb-8">
      <h1 class="text-4xl md:text-5xl font-extrabold text-brand-text tracking-tight mb-2">Orange Fox</h1>
    </div>

    <div id="app" class="w-full max-w-md">
      <!-- Container for alerts -->
      <div id="alert-container" class="mb-4 hidden p-3 rounded-lg text-sm font-semibold text-center transition-all"></div>
      
      <!-- Auth Container -->
      <div id="auth-container" class="glass-panel rounded-2xl p-8 relative overflow-hidden transition-all duration-500">
        
        <!-- Toggle buttons -->
        <div class="flex gap-2 mb-6 bg-brand-cream/80 p-1 rounded-lg border border-white/50 shadow-sm">
          <button id="tab-login" class="flex-1 py-2 rounded-md text-sm font-bold bg-white shadow-sm text-brand-text transition-colors">Login</button>
          <button id="tab-register" class="flex-1 py-2 rounded-md text-sm font-bold text-brand-text/60 hover:text-brand-text transition-colors">Register</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="flex flex-col gap-4">
          <div>
            <label class="block text-xs uppercase tracking-wider mb-1 font-semibold text-brand-text/70">Username</label>
            <input type="text" id="login-username" required class="input-field w-full px-4 py-3 rounded-lg" placeholder="doejohn" />
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wider mb-1 font-semibold text-brand-text/70">Password</label>
            <input type="password" id="login-password" required class="input-field w-full px-4 py-3 rounded-lg" placeholder="••••••••" />
          </div>
          <button type="submit" id="login-btn" class="btn-primary w-full py-3 rounded-lg mt-2 flex items-center justify-center h-[50px]">
            <span>Sign In</span>
            <div class="loader hidden ml-2"></div>
          </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="flex flex-col gap-4 hidden">
          <div>
            <label class="block text-xs uppercase tracking-wider mb-1 font-semibold text-brand-text/70">Email</label>
            <input type="email" id="reg-email" required class="input-field w-full px-4 py-3 rounded-lg" placeholder="user@domain.com" />
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wider mb-1 font-semibold text-brand-text/70">Username</label>
            <input type="text" id="reg-username" required class="input-field w-full px-4 py-3 rounded-lg" placeholder="doejohn" />
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wider mb-1 font-semibold text-brand-text/70">Password</label>
            <input type="password" id="reg-password" required class="input-field w-full px-4 py-3 rounded-lg" placeholder="••••••••" />
          </div>
          <button type="submit" id="reg-btn" class="btn-primary w-full py-3 rounded-lg mt-2 flex items-center justify-center h-[50px]">
            <span>Create Account</span>
            <div class="loader hidden ml-2"></div>
          </button>
        </form>
      </div>

      <!-- Profile Container -->
      <div id="profile-container" class="glass-panel rounded-2xl p-8 text-center hidden">
        <div class="w-20 h-20 bg-brand-accent rounded-full mx-auto mb-4 flex items-center justify-center shadow-lg border-4 border-white">
          <span id="profile-initial" class="text-3xl font-bold text-white">J</span>
        </div>
        <h2 id="profile-name" class="text-2xl font-bold mb-1 text-brand-text">John Doe</h2>
        <p id="profile-email" class="text-brand-text/70 text-sm mb-6">john@example.com</p>
        
        <div class="bg-white/60 rounded-lg p-4 mb-6 text-left border border-white">
          <p class="text-xs text-brand-text/60 uppercase tracking-wide mb-1">Role</p>
          <p id="profile-role" class="font-semibold text-brand-text">USER</p>
        </div>

        <button id="logout-btn" class="w-full py-3 rounded-lg border-2 border-brand-accent text-brand-accent font-bold hover:bg-brand-accent hover:text-white transition-colors flex justify-center items-center h-[50px]">
          <span>Log Out</span>
          <div class="loader hidden ml-2 border-brand-accent border-top-transparent"></div>
        </button>
      </div>
      
    </div>
  </body>
</html>
